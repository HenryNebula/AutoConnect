[project]
name = "autoconnect"
version = "0.1.0"
description = "Linux solver/bot for the 宠物连连看 (Pokémon Lianliankan) Flash game"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "opencv-python-headless",
    "websocket-client",
    # supervised tile-pair classifier (issue #3). Default (CUDA) wheels so
    # training uses the GPU when available; train_classifier.py falls back to CPU.
    "torch",
    # CPU serving of the trained pair classifier (ONNX export + inference).
    "onnxruntime",
    "onnx",
    "onnxscript",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pybind11>=3.1.0",
]
